server:
  port: 8080
  # 接口统一前缀 /api 由各 Controller 的 @RequestMapping("/api/xxx") 声明；
  # 不设置 context-path，静态资源（/img/**）才能直接挂在根路径下访问。

spring:
  application:
    name: harmonymall-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/harmonymall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

harmonymall:
  jwt:
    # 生产环境请更换为随机长字符串，并通过环境变量注入
    secret: harmonymall-graduation-design-secret-key-2026
    expire-hours: 24
  order:
    # 未支付订单超时自动取消的分钟数（定时任务每 20s 扫一次）
    timeout-minutes: 30
    # 发货后多少天未确认收货则自动确认（定时任务每小时扫一次）
    auto-confirm-days: 7

# 首次如未手动执行 SQL，可放开下面配置自动初始化库表（默认注释）
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:db/schema.sql
#      data-locations: classpath:db/data.sql
